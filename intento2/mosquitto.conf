# Red de servicios - Configuración de persistencia 
persistence true
persistence_location ./data/
autosave_interval 1800

# Listener y red
listener 1883
allow_anonymous true

# Logging para evidencias de la memoria [cite: 16]
log_dest file ./mosquitto.log
log_type all
connection_messages true
log_timestamp true

# Límites para evitar congestión estructural 
max_queued_messages 5000
max_inflight_messages 40
