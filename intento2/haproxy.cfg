global
    maxconn 2000

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_gateway
    bind *:8080
    default_backend middleware_pool

backend middleware_pool
    balance roundrobin
    option httpchk
    server bridge_1 127.0.0.1:8001 check
    server bridge_2 127.0.0.1:8002 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-node

